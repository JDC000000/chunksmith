<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chunksmith</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #eee; font-family: system-ui, sans-serif; }
      #app { width: 100vw; height: 100vh; }
      canvas { display: block; }
      #overlay {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        pointer-events: none; z-index: 10;
      }
      #overlay.hidden { display: none; }
      #overlay .card {
        pointer-events: auto; background: rgba(0,0,0,0.6); border: 1px solid #444;
        padding: 24px 32px; border-radius: 8px; text-align: center;
      }
      #overlay h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
      #overlay p  { margin: 0; opacity: 0.75; font-size: 14px; }
      #stats { position: absolute; top: 8px; left: 8px; z-index: 5; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"><div class="card"><h1>Chunksmith</h1><p>Click to play &middot; WASD to move &middot; Esc to release</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
